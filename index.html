<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback</title>
    <meta name="description" content="Provide anonymous feedback for our event.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="admin.html">Admin Dashboard &rarr;</a>
    </nav>
    <div class="container">
        <div class="glass-panel">
            <h1>Event Feedback</h1>
            <p class="subtitle">We value your anonymous input to make our future events better.</p>
            
            <div id="statusMessage" class="message"></div>

            <form id="feedbackForm">
                <div class="form-group">
                    <label for="experience">How was your experience?</label>
                    <textarea id="experience" placeholder="Tell us what you liked..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="improvements">Future improvements</label>
                    <textarea id="improvements" placeholder="What could we do better?" required></textarea>
                </div>

                <div class="form-group">
                    <label>Overall Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required />
                        <label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1 star">★</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Submit Feedback</button>
            </form>
        </div>
    </div>

    <!-- Main Application Logic (type="module" is critical for Firebase V9/V10 CDN imports) -->
    <script type="module" src="app.js"></script>
</body>
</html>
